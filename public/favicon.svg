<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="スキルマップ">
  <!-- 力量マトリクス(スキル × メンバー)を、レベルの濃淡で表した 3×3 のグリッド -->
  <style>
    .bg { fill: #1f5fbf; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7db0ff; }
      .dot { fill: #12161c; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14" />
  <g class="dot">
    <circle cx="19" cy="19" r="6" opacity="1" />
    <circle cx="32" cy="19" r="6" opacity="0.75" />
    <circle cx="45" cy="19" r="6" opacity="0.4" />
    <circle cx="19" cy="32" r="6" opacity="0.75" />
    <circle cx="32" cy="32" r="6" opacity="1" />
    <circle cx="45" cy="32" r="6" opacity="0.75" />
    <circle cx="19" cy="45" r="6" opacity="0.4" />
    <circle cx="32" cy="45" r="6" opacity="0.75" />
    <circle cx="45" cy="45" r="6" opacity="1" />
  </g>
</svg>
